aid: high-fidelity
name: High Fidelity
description: >-
  High Fidelity provides live spatial audio technology for apps and games. Its
  Spatial Audio Client Library (hifi-spatial-audio, MIT) lets developers embed
  realistic positional voice — 3D azimuth/distance transforms, nearfield
  "whisper" audio, noise reduction, and many simultaneous speakers over the Opus
  codec — into web and native applications, and previously connected them to a
  hosted Spatial Audio API server via signed connection JWTs. Apps including
  Clubhouse, Hubbub, Breakroom, and Soundstage used the technology. The hosted
  API service has since been discontinued; the SDK remains open source, and the
  company's active product is Quad, a spatial social platform that recreates
  physical meeting spaces. High Fidelity was founded by Philip Rosedale and is a
  portfolio company of GV.
